apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamal-k8s-app
  labels:
    app: kamal-k8s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamal-k8s-app
  template:
    metadata:
      labels:
        app: kamal-k8s-app
    spec:
      containers:
        - name: kamal-k8s-app
          image: kamalk8acr.azurecr.io/kamal-k8s-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kamal-k8s-service
spec:
  type: LoadBalancer
  selector:
    app: kamal-k8s-app
  ports:
    - port: 80
      targetPort: 8000
