apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamal-k8s-app
  namespace: kamal-demo
  labels:
    app: kamal-k8s-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kamal-k8s-app
  template:
    metadata:
      labels:
        app: kamal-k8s-app
    spec:
      containers:
        - name: kamal-k8s-app
          image: kamalk8acr.azurecr.io/kamal-k8s-app:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          # Probes so K8s knows if your app is alive/ready
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: kamal-k8s-service
  namespace: kamal-demo
spec:
  type: LoadBalancer
  selector:
    app: kamal-k8s-app
  ports:
    - port: 80
      targetPort: 8000
